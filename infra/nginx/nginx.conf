# ItWorksOnMyResume — Nginx reverse proxy
# File: infra/nginx/nginx.conf
#
# In development: not used — dotnet run serves directly on 5000.
# In local "production" mode: this sits in front of the API container.
#
# The ASP.NET Core API is expected at http://host.docker.internal:5000
# (adjust if running API in its own container)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── General settings ─────────────────────────
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;    # avatar uploads

    # ── Rate limiting ─────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Upstream: ASP.NET Core API ────────────────
    upstream api {
        server host.docker.internal:5000;
        # If running API in Docker: server iwomr-api:5000;
    }

    # ── HTTP server ───────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Redirect to HTTPS in production
        # return 301 https://$host$request_uri;

        # ── API proxy ────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;

            # Required for SignalR WebSocket upgrade
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;

            proxy_read_timeout  120s;   # long enough for SignalR
            proxy_send_timeout  120s;
        }

        # ── SignalR hubs (WebSocket path) ─────────
        location /hubs/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;   # keep WS alive
        }

        # ── Health check ──────────────────────────
        location /health {
            proxy_pass http://api;
        }
    }

    # ── HTTPS server (uncomment when certs are ready) ─
    # server {
    #     listen 443 ssl;
    #     server_name localhost;
    #
    #     ssl_certificate     /etc/nginx/certs/cert.pem;
    #     ssl_certificate_key /etc/nginx/certs/key.pem;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/  { ... same as above ... }
    #     location /hubs/ { ... same as above ... }
    # }
}
